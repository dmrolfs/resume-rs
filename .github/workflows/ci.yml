# ABOUTME: CI for resume-rs: runs the `just check` quality gate on macOS and Windows for every push and PR.
# ABOUTME: Also builds release binaries per OS and a universal2 macOS binary on main and version tags.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main; superseded runs on other refs are wasted minutes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The justfile pins bash as its shell; keep CI on the same `just` the repo was developed with.
  JUST_VERSION: "1.40.0"

# Third-party actions are pinned to full commit SHAs (public repo, supply chain). The trailing comment
# names the release each SHA was resolved from. Dependabot (.github/dependabot.yml) proposes bumps.
jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # a failure on one OS must not hide the result on the other
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            binary: resume
          - os: windows-latest
            binary: resume.exe
    steps:
      # Windows git defaults can convert line endings on checkout. Force the conversion on so
      # .gitattributes (eol=lf, -text on fixtures) is actually exercised by the tests, not bypassed.
      - name: Enable git autocrlf (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf true

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `just` runs recipes with `bash`, resolved from PATH. The Windows image also has WSL's
      # System32\bash.exe, which would hijack that lookup, so put Git Bash first and verify it.
      - name: Put Git Bash first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'

      - name: Verify the bash that just will use
        shell: bash
        run: |
          kernel="$(bash -c 'uname -s')"
          echo "bash resolves to: $(command -v bash) ($kernel)"
          case "$kernel" in
            Darwin | MINGW* | MSYS*) ;;
            *) echo "unexpected bash ($kernel); just recipes would run in the wrong shell" >&2; exit 1 ;;
          esac

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so a branch cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Quality gate (fmt, clippy -D warnings, test)
        run: just check

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload release binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resume-${{ runner.os }}-${{ runner.arch }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  # The macOS universal2 build runs on main and release tags only, so the `just build-macos` recipe
  # cannot rot unnoticed without spending minutes on every branch push.
  universal2:
    name: universal2 (macOS)
    needs: check
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain with both macOS targets
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Build, sign, and verify the universal2 binary
        run: just build-macos

      - name: Upload universal2 binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resume-macOS-universal2
          path: target/universal2/resume
          if-no-files-found: error
          retention-days: 7
