[package]
name = "advisor"
version = "0.1.0"
edition = "2024"
# The same floor as `resume`, which this package builds on. A no-TLS ureq 3.5 was measured to build at 1.92 (rsm-eam.5.1).
rust-version = "1.92"
authors = ["Damon Rolfs <drolfs@gmail.com>"]
description = "Proposes resume wording for a job description from cited evidence, using a model on the local machine."
license = "MIT"
repository = "https://github.com/dmrolfs/resume-rs"
keywords = ["resume", "job-description", "llm"]
categories = ["command-line-utilities", "text-processing"]
publish = false

[lints]
workspace = true

[[bin]]
name = "resume-advisor"
path = "src/main.rs"

# Dependencies are added by the task that first uses them; the `unused_dependencies` lint enforces it.
# serde_json carries `raw_value` (rsm-eam.5.3) so provider JSON is kept exactly as written; `preserve_order` arrives with
# the request builder (rsm-eam.5.10). `resume` must get neither, and `arbitrary_precision` is never used here
# (tests/dependencies_test.rs checks all three).
[dependencies]
clap = { version = "4.6", features = ["derive"] }
resume = { path = "../.." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11"
snafu = "0.9.2"
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
claims = "0.8.0"
pretty_assertions = "1.4.1"
tempfile = "3"
