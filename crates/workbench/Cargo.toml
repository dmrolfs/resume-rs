[package]
name = "workbench"
version = "0.1.0"
edition = "2024"
# gpui-pre-macos 0.3.14 uses `Option::map_or_default`, stable in 1.98; 1.97.1 fails, 1.98 and 1.99 build (measured in
# rsm-yjj.1 on macOS, not yet on Windows). The `resume` package keeps its own, lower floor.
rust-version = "1.98"
authors = ["Damon Rolfs <drolfs@gmail.com>"]
description = "Desktop app to view resume content, Typst styles, and position specs, and to build PDFs from them."
license = "MIT"
repository = "https://github.com/dmrolfs/resume-rs"
publish = false

[lints]
workspace = true

[[bin]]
name = "resume-workbench"
path = "src/main.rs"

# Throwaway spike for rsm-yjj.1; deleted or replaced by the real shell in rsm-yjj.6.
[[bin]]
name = "spike"
path = "src/bin/spike.rs"

# Dependencies are added by the task that first uses them; the `unused_dependencies` lint enforces it.
[dependencies]
resume = { path = "../.." }
# Pinned exactly: gpui-kit 0.11.0 pins the matching gpui-pre 0.3.14 and re-exports GPUI, base, component and the icons
# (rsm-yjj decisions D1). It also supplies the platform layer, which gpui-pre alone does not.
gpui-kit = { version = "=0.11.0", features = ["tree-sitter", "tree-sitter-markdown"] }
lsp-types = "0.97"
opener = "0.9"
typst-ide = "=0.15.1"
typst-syntax = "=0.15.1"
anyhow = "1"
notify = "8"
tempfile = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "6"
sha2 = "0.11"
snafu = "0.9.2"
strum = { version = "0.28.0", features = ["derive"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
typst = "=0.15.1"
typst-layout = "=0.15.1"

[dev-dependencies]
claims = "0.8.0"
pretty_assertions = "1.4.1"
gpui-kit = { version = "=0.11.0", features = ["test-support"] }
