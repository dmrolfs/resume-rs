[package]
name = "resume"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Damon Rolfs <drolfs@gmail.com>"]
description = "Typesets Markdown resumes into print-quality PDFs with embedded Typst and book-recommended styles."
license = "MIT AND OFL-1.1"
repository = "https://github.com/dmrolfs/resume-rs"
readme = "README.md"
keywords = ["resume", "cv", "typst", "pdf", "markdown"]
categories = ["command-line-utilities", "text-processing"]

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2021_incompatible_closure_captures = "warn"
rust_2021_prelude_collisions = "warn"

# Cargo manifest lints need cargo 1.100 or newer; an older cargo warns "unused manifest key" and ignores
# this table. `clippy -D warnings` does not escalate them, so the level is set here, and it makes a
# declared [dependencies] entry that no target uses a hard error. See ref/Resume-RS-Architecture.md for
# what the lint cannot see.
[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

# cargo-machete (`just unused-deps`) reads source text, so it cannot see a crate that is only named by code a
# macro generates: nutype's `validate(regex = ...)` expands to `::regex::Regex`, so `regex` stays a direct
# dependency without a `regex::` path anywhere in src/. Neither check can see it go unused, so
# tests/manifest_test.rs fails when nothing in src/ uses `validate(regex` any more.
[package.metadata.cargo-machete]
ignored = ["regex"]

# Dependencies are added by the task that first uses them; the `unused_dependencies` lint above enforces it.
# Typst crates are pinned exactly (`=0.15.1`) when added in rsm-141.6; see ref/Resume-RS-Implementation-Plan.md.
[dependencies]
clap = { version = "4.6", features = ["derive"] }
codespan-reporting = "0.13"
humantime = "2.4"
include_dir = "0.7"
nutype = { version = "0.8.0", features = ["serde", "regex"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "2"
snafu = "0.9.2"
strsim = "0.11"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3"
time = { version = "0.3.55", features = ["serde"] }
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["embedded-fonts", "scan-fonts"] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
unicode-width = "0.2"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2"
claims = "0.8.0"
insta = { version = "1.49.0", features = ["json"] }
lopdf = { version = "0.47", default-features = false }
predicates = "3"
pretty_assertions = "1.4.1"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rayon = "1"
sha2 = "0.11"
