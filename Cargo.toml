[package]
name = "resume"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["Damon Rolfs <drolfs@gmail.com>"]
description = "Typesets Markdown resumes into print-quality PDFs with embedded Typst and book-recommended styles."
license = "MIT"
repository = "https://github.com/dmrolfs/resume-rs"
readme = "README.md"
keywords = ["resume", "cv", "typst", "pdf", "markdown"]
categories = ["command-line-utilities", "text-processing"]

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2021_incompatible_closure_captures = "warn"
rust_2021_prelude_collisions = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

# Dependencies are added by the task that first uses them (cargo warns on unused ones).
# Typst crates are pinned exactly (`=0.15.1`) when added in rsm-141.6; see ref/Resume-RS-Implementation-Plan.md.
[dependencies]
clap = { version = "4.6", features = ["derive"] }
codespan-reporting = "0.13"
include_dir = "0.7"
nutype = { version = "0.8.0", features = ["serde", "regex"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snafu = "0.9.2"
strum = { version = "0.28.0", features = ["derive"] }
time = { version = "0.3.55", features = ["serde"] }
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["embedded-fonts"] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
unicode-width = "0.2"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2"
claims = "0.8.0"
insta = { version = "1.49.0", features = ["json"] }
lopdf = { version = "0.47", default-features = false }
predicates = "3"
pretty_assertions = "1.4.1"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rayon = "1"
tempfile = "3"
